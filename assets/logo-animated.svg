<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="Leon_pro">
<style>
.a,.b,.c{transform-box:fill-box;transform-origin:50% 100%}
.a{animation:kA 7s cubic-bezier(.2,.8,.2,1) infinite both}
.b{animation:kB 7s cubic-bezier(.2,.8,.2,1) infinite both}
.c{animation:kC 7s cubic-bezier(.2,.8,.2,1) infinite both}
.band{transform-box:fill-box;transform-origin:50% 50%;animation:kBand 7s cubic-bezier(.2,.8,.2,1) infinite both}
.word{font-family:Unbounded,'Arial Black',sans-serif;font-weight:700;font-size:54px;animation:kWord 7s cubic-bezier(.2,.8,.2,1) infinite both}
.shine{animation:kShine 7s ease-in-out infinite both}
@keyframes kA{0%{transform:scaleY(0);opacity:0}2%{opacity:1}12%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kB{0%,4%{transform:scaleY(0);opacity:0}6%{opacity:1}16%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kC{0%,9%{transform:scaleY(0);opacity:0}11%{opacity:1}21%{transform:scaleY(1)}86%{opacity:1;transform:scaleY(1)}93%,100%{opacity:0;transform:scaleY(1)}}
@keyframes kBand{0%,17%{transform:scaleX(0);opacity:0}19%{opacity:1}27%{transform:scaleX(1)}86%{opacity:1;transform:scaleX(1)}93%,100%{opacity:0;transform:scaleX(1)}}
@keyframes kWord{0%,25%{letter-spacing:.45em;opacity:0}36%{letter-spacing:0;opacity:1}86%{letter-spacing:0;opacity:1}93%,100%{letter-spacing:0;opacity:0}}
@keyframes kShine{0%,38%{transform:translateX(0)}52%,100%{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){.a,.b,.c,.band,.word,.shine{animation:none}}
</style>
<defs>
<linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59A3A"/><stop offset="1" stop-color="#D9620F"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E5701A"/><stop offset=".5" stop-color="#F58C2C"/><stop offset="1" stop-color="#E06A14"/></linearGradient>
<clipPath id="cl"><polygon points="320,140 170,400 470,400"/><polygon points="90,360 510,360 560,450 40,450"/></clipPath>
</defs>
<polygon class="a" points="250,40 40,400 460,400" fill="#F4F1EC"/>
<polygon class="b" points="330,70 130,400 530,400" fill="#F4F1EC"/>
<polygon class="c" points="320,140 170,400 470,400" fill="url(#or)"/>
<polygon class="band" points="90,360 510,360 560,450 40,450" fill="url(#bg)"/>
<g clip-path="url(#cl)"><rect class="shine" x="-140" y="100" width="70" height="380" fill="#fff" opacity=".35" transform="skewX(-20)"/></g>
<text class="word" x="300" y="424" text-anchor="middle" fill="#17171A">Leon_pro</text>
</svg>
